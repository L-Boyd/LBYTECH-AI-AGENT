spring:
  application:
    name: LBYTECH-AI-AGENT
  ai:
    dashscope:
      api-key: ${API-KEY}
      chat:
        options:
          model: qwen-plus
    vectorstore:
      pgvector:
      index-type: HNSW  # 索引类型
      distance-type: COSINE_DISTANCE  # 距离类型（哪种方式进行相似度检索）
      dimensions: 1536  # 向量维度
      max-document-batch-size: 10000 # Optional: Maximum number of documents per batch（每次批量处理的文档数量）
  datasource:
    url: jdbc:postgresql://pgm-wz9w1bsn24436w61wo.rwlb.rds.aliyuncs.com:5432/ai_agent
    username: ${PG-USERNAME}
    password: ${PG-PASSWORD}

server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lbytech.lbytechAiAgent.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

lbytech:
  ali:
    api-key: ${API-KEY}
  searchapi:
    api-key: ${SEARCHAPI-KEY}


logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
