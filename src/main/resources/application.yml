spring:
  application:
    name: LBYTECH-AI-AGENT
  ai:
    dashscope:
      api-key: ${API-KEY}
      chat:
        options:
          model: ${AI-MODEL}
    vectorstore:
      pgvector:
      index-type: HNSW  # 索引类型
      distance-type: COSINE_DISTANCE  # 距离类型（哪种方式进行相似度检索）
      dimensions: 1536  # 向量维度
      max-document-batch-size: 10000 # Optional: Maximum number of documents per batch（每次批量处理的文档数量）
    mcp:
      client:
        stdio:
          # servers-configuration: classpath:static/mcp/win-mcp-servers.json
          root-change-notification: true
          connections:
            amap-maps:
              command: npx.cmd
              args:
                - -y
                - "@amap/amap-maps-mcp-server"
              env:
                AMAP_MAPS_API_KEY: ${HMAP-API-KEY}

  datasource:
    url: jdbc:postgresql://localhost:5432/lby_ai_agent
    username: ${PG-USERNAME}
    password: ${PG-PASSWORD}

server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lbytech.lbytechAiAgent.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

lbytech:
  ali:
    api-key: ${API-KEY}
  searchapi:
    api-key: ${SEARCHAPI-KEY}


logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
